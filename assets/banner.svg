<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgOlist" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c18" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#040710" />
    </linearGradient>

    <linearGradient id="neonOlistGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#00FFF7" />
      <stop offset="100%" stop-color="#FF00FF" />
    </linearGradient>

    <linearGradient id="shimmerGrad" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clip Path -->
    <clipPath id="bannerClip">
      <rect x="0" y="0" width="1000" height="250" rx="14" />
    </clipPath>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.15) translate(-8px, 6px); opacity: 0.6; }
    }
    @keyframes shimmerMove {
      0% { transform: translateX(-300px); }
      100% { transform: translateX(1000px); }
    }
    @keyframes floatRoute {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -30; }
    }
    @keyframes kpiBar1 { 0%, 100% { height: 22px; y: 88px; } 50% { height: 55px; y: 55px; } }
    @keyframes kpiBar2 { 0%, 100% { height: 45px; y: 65px; } 50% { height: 20px; y: 90px; } }
    @keyframes kpiBar3 { 0%, 100% { height: 65px; y: 45px; } 50% { height: 75px; y: 35px; } }

    .orb-gold { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 150px 80px; }
    .orb-cyan { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 850px 150px; }
    .shimmer-line { animation: shimmerMove 4s linear infinite; }

    .route-dash { stroke-dasharray: 6, 6; animation: floatRoute 2s linear infinite; }
    .kbar-1 { animation: kpiBar1 1.4s ease-in-out infinite; }
    .kbar-2 { animation: kpiBar2 1.1s ease-in-out infinite 0.3s; }
    .kbar-3 { animation: kpiBar3 1.6s ease-in-out infinite 0.6s; }

    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif; font-weight: 800; }
    .body-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif; font-weight: 400; }
    .mono-text { font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Fira Code', monospace; }
  </style>

  <g clip-path="url(#bannerClip)">
    <!-- Base Background -->
    <rect x="0" y="0" width="1000" height="250" fill="url(#bgOlist)" />

    <!-- Ambient Glowing Orbs -->
    <circle cx="150" cy="70" r="140" fill="#FFD700" opacity="0.18" class="orb-gold" filter="url(#neonGlow)" />
    <circle cx="850" cy="140" r="160" fill="#00FFF7" opacity="0.18" class="orb-cyan" filter="url(#neonGlow)" />
    <circle cx="500" cy="30" r="100" fill="#FF00FF" opacity="0.12" class="orb-gold" filter="url(#neonGlow)" />

    <!-- Technical Grid Pattern -->
    <g opacity="0.06" stroke="#00FFF7" stroke-width="1">
      <line x1="0" y1="50" x2="1000" y2="50" />
      <line x1="0" y1="100" x2="1000" y2="100" />
      <line x1="0" y1="150" x2="1000" y2="150" />
      <line x1="0" y1="200" x2="1000" y2="200" />
      <line x1="100" y1="0" x2="100" y2="250" />
      <line x1="250" y1="0" x2="250" y2="250" />
      <line x1="400" y1="0" x2="400" y2="250" />
      <line x1="550" y1="0" x2="550" y2="250" />
      <line x1="700" y1="0" x2="700" y2="250" />
      <line x1="850" y1="0" x2="850" y2="250" />
    </g>

    <!-- Animated Logistics Mesh & Analytical Bars on Right -->
    <g opacity="0.85" transform="translate(710, 15)">
      <!-- Logistics Route Mesh -->
      <g filter="url(#softGlow)">
        <path d="M 30,100 Q 80,40 140,80 T 230,50" fill="none" stroke="#FFD700" stroke-width="1.8" class="route-dash" />
        <path d="M 50,40 Q 120,90 180,40 T 250,90" fill="none" stroke="#00FFF7" stroke-width="1.5" class="route-dash" opacity="0.7" />

        <!-- Geo Nodes -->
        <circle cx="30" cy="100" r="4.5" fill="#FFD700" />
        <circle cx="140" cy="80" r="5" fill="#00FFF7" />
        <circle cx="230" cy="50" r="4" fill="#FF00FF" />
        <circle cx="50" cy="40" r="3.5" fill="#FFD700" />
        <circle cx="180" cy="40" r="4.5" fill="#00FFF7" />
      </g>

      <!-- Revenue / Metric Bars -->
      <g transform="translate(140, 20)">
        <rect x="0" y="88" width="8" height="22" rx="3" fill="#FFD700" class="kbar-1" />
        <rect x="14" y="65" width="8" height="45" rx="3" fill="#00FFF7" class="kbar-2" />
        <rect x="28" y="45" width="8" height="65" rx="3" fill="#FF00FF" class="kbar-3" />
      </g>
    </g>

    <!-- Top Glow Accent Line with Shimmer -->
    <rect x="0" y="0" width="1000" height="3" fill="url(#neonOlistGrad)" />
    <rect x="0" y="0" width="250" height="3" fill="url(#shimmerGrad)" class="shimmer-line" />

    <!-- Top Badge / Header Tag -->
    <g transform="translate(60, 36)">
      <rect x="0" y="0" width="350" height="26" rx="13" fill="#181e32" stroke="#FFD700" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="13" cy="13" r="4.5" fill="#FFD700" filter="url(#softGlow)" />
      <text x="26" y="17" fill="#E2E8F0" font-size="11" class="title-text" letter-spacing="1">
        COLUMNAR ETL &amp; E-COMMERCE ML
      </text>
    </g>

    <!-- Main Title: BRAZILIAN E-COMMERCE -->
    <g transform="translate(60, 108)">
      <!-- Shopping Bag / Cart Icon -->
      <g transform="translate(0, -32) scale(0.95)">
        <path d="M6 10 L26 10 L24 28 L8 28 Z M11 10 C11 5 21 5 21 10" 
              fill="none" stroke="#FFD700" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
      </g>
      
      <text x="50" y="5" fill="#FFFFFF" font-size="38" class="title-text" letter-spacing="1.5">
        BRAZILIAN E-COMMERCE
      </text>
      <text x="560" y="5" fill="#FFD700" font-size="38" class="title-text" letter-spacing="1.5" filter="url(#softGlow)">
        OLIST
      </text>
    </g>

    <!-- Subtitle -->
    <text x="60" y="148" fill="#94A3B8" font-size="15" class="body-text" letter-spacing="0.5">
      Engenharia de Dados com Polars &amp; DuckDB, Segmentação RFM e Modelagem Preditiva com XGBoost
    </text>

    <!-- Bottom Status Badges Row -->
    <g transform="translate(60, 180)">
      <rect x="0" y="0" width="700" height="34" rx="8" fill="#091222" stroke="#162947" stroke-width="1" opacity="0.9" />
      
      <!-- Feature Pills -->
      <g transform="translate(20, 21)">
        <circle cx="0" cy="-3" r="4" fill="#FFD700" />
        <text x="10" y="1" fill="#CBD5E1" font-size="11.5" class="title-text">Python 3.12</text>
      </g>
      
      <g transform="translate(135, 21)">
        <circle cx="0" cy="-3" r="4" fill="#00FFF7" />
        <text x="10" y="1" fill="#CBD5E1" font-size="11.5" class="title-text">Polars &amp; DuckDB</text>
      </g>

      <g transform="translate(290, 21)">
        <circle cx="0" cy="-3" r="4" fill="#FF00FF" />
        <text x="10" y="1" fill="#CBD5E1" font-size="11.5" class="title-text">XGBoost + Optuna</text>
      </g>

      <g transform="translate(460, 21)">
        <circle cx="0" cy="-3" r="4" fill="#10B981" />
        <text x="10" y="1" fill="#CBD5E1" font-size="11.5" class="title-text">R$ 13.2M GMV // 100k Orders</text>
      </g>
    </g>

    <!-- Subtle Border Around Banner -->
    <rect x="0" y="0" width="1000" height="250" rx="14" fill="none" stroke="#FFD700" stroke-width="1.5" stroke-opacity="0.4" />
  </g>
</svg>
